# Knowledge — an application from us beside the Business OS kernel. Rendered by the kernel's installer (bin/app_install.php):
# {{APP_FQDN}} = knowledge.<domain>, {{APP_DIR}} = /srv/apps/knowledge, the ports from config/.env.
# Two virtual hosts: the public name for people (and the proxied MCP servers and the key-checked questions API), and a loopback
# port for the kernel's actions server and approval replays.

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/knowledge-error.log
	CustomLog ${APACHE_LOG_DIR}/knowledge-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
	# Uploads: the source limit is a setting (50 MB by default); Apache must not be the lower bound.
	LimitRequestBody 104857600
	<IfModule php_module>
		# PHP must admit what LimitRequestBody does (slice 2: a 50 MB file, 20 files a request, 100 MB a request).
		php_value upload_max_filesize 52M
		php_value post_max_size 100M
		php_value max_file_uploads 20
	</IfModule>

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# The two read MCP servers, under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard checks it
	# against loopback). Bearer auth is the servers' own (a person's token, the tenant's run token, or the kernel's).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# The public allow-list under /api/v1/: the health check and the questions API (bearer = a key bound to one base;
	# rate-limited and logged by the handler). Nothing else answers under /api.
	#   POST /api/v1/ask   POST /api/v1/search   GET /api/v1/bases   GET /api/v1/questions/{id}   POST /api/v1/questions/{id}/feedback
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/v1/(ask|search|bases)/?$ /api/v1/$1.php [L,QSA]
	RewriteRule ^/api/v1/questions/([0-9]+)/?$ /api/v1/question.php?id=$1 [L,QSA]
	RewriteRule ^/api/v1/questions/([0-9]+)/feedback/?$ /api/v1/feedback.php?id=$1 [L,QSA]
	RewriteRule ^/api/v1/[a-z_-]+\.php$ - [L]
	RewriteRule ^/api/ - [R=404,L]
	# The engine bridge (slice 5) answers on the internal port only.
	RewriteRule ^/internal/ - [R=404,L]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# The gated file door (a session, and the base's reach): an original upload, a section's page image.
	RewriteRule ^/files/([0-9]+)$ /files.php?id=$1 [L,QSA]

	# Screens outside the canonical shape (the manifest, Phase 1): a page of a record (/bases/12/sources, /sources/7/outline).
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/new -> form.php, /x/{id}/edit -> form.php?id=, /x/{id} -> view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/knowledge-error.log
	CustomLog ${APACHE_LOG_DIR}/knowledge-access.log combined
	LimitRequestBody 104857600
	<IfModule php_module>
		# PHP must admit what LimitRequestBody does (slice 2: a 50 MB file, 20 files a request, 100 MB a request).
		php_value upload_max_filesize 52M
		php_value post_max_size 100M
		php_value max_file_uploads 20
	</IfModule>
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/files/([0-9]+)$ /files.php?id=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
